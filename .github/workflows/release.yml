name: release

# On a version tag (v1.0.0, v1.2.3, ...), build a per-OS binary, run the tests
# against it, and attach the binaries to a GitHub Release so people can download
# instead of cloning and building. The Linux binary is static (no glibc version
# to match); macOS cannot fully static-link, so it is a normal dynamic build.
on:
  push:
    tags: ['v*']

permissions:
  contents: write        # create the Release and upload assets

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ldflags: "-static"
          - os: macos-latest
            ldflags: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: build and test
        run: make LDFLAGS="${{ matrix.ldflags }}" && make ut

      - name: name the binary
        run: |
          os=$(uname -s); case "$os" in Linux) os=linux ;; Darwin) os=macos ;; esac
          cp iac "iac-$os-$(uname -m)"

      - name: upload build
        uses: actions/upload-artifact@v4
        with:
          name: iac-${{ matrix.os }}
          path: iac-*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: gather binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: attach binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/iac-*
          generate_release_notes: true
